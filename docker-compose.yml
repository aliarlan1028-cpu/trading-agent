services:
  trading-agent:
    build: .
    env_file:
      - .env
    ports:
      - "127.0.0.1:8787:8787"  # 只暴露给本机 Caddy 反代;曾绑 0.0.0.0 公网可直连(审计高危)
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
    mem_limit: 1g
    cpus: 1.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "scripts/healthcheck.mjs"]
      interval: 30s
      timeout: 10s
      retries: 3
